# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_STD_CPP17=y

# 32773 == 0x8005 (example lighting-app)
#RGBTW
CONFIG_CHIP_DEVICE_PRODUCT_ID=36880
CONFIG_CHIP_DEVICE_VENDOR_ID=4476
#CCT
# CONFIG_CHIP_DEVICE_PRODUCT_ID=36879
# CONFIG_CHIP_DEVICE_VENDOR_ID=4476
# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="LED Light0x07C2"

# Disable Matter OTA DFU
CONFIG_CHIP_OTA_REQUESTOR=y

# Software Version 0x01000005
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION=16777221
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION_STRING="1.0.5"


# Disable CHIP shell support
CONFIG_CHIP_LIB_SHELL=n

# Disable CHIP NFC for commissioning
CONFIG_CHIP_NFC_COMMISSIONING=n

# Disable factory data support
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=n
CONFIG_CHIP_FACTORY_DATA_MERGE_WITH_FIRMWARE=n
CONFIG_CHIP_CERTIFICATION_DECLARATION_STORAGE=y
CONFIG_SECURE_PROGRAMMING=y

# Enable PWM
CONFIG_PWM=y
# Enable Power Management
CONFIG_PM=n

CONFIG_GPIO=y

# Enable Function for Demo
CONFIG_I2C=y
CONFIG_ADC=y
# Enable Independent Button
CONFIG_CHIP_BUTTON_MANAGER_IRQ_MODE=n

CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_TELINK_B9X_WDT_TIMEOUT=30000
CONFIG_TELINK_B9X_WDT_FEED=1000

# Choose Device Type
CONFIG_DeviceType_DimmableLight=n
CONFIG_DeviceType_ColorTemperatureLight=n
CONFIG_DeviceType_ExtendedColorLight=y

CONFIG_MS15155E_STRIP_SPI=y
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y
CONFIG_MS15155E_STRIP=y
CONFIG_SPI=y

CONFIG_STARTUP_OPTIMIZATE=n

CONFIG_OPENTHREAD_THREAD_VERSION_1_3_1=y

CONFIG_ADC_B9X_ACQUISITION_THREAD_STACK_SIZE=1024

CONFIG_DEFERRED_ATTR_STORAGE=y
